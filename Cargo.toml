[package]
name = "unframed"
version = "0.0.1"
edition = "2021"
default-run = "ufm"

[dependencies]
iris = { path = "../optics/bindings/iris-rs/crates/iris" }
flux = { path = "../optics/bindings/flux-rs/crates/flux" }
lens = { path = "../optics/bindings/lens-rs/crates/lens" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "pnm", "qoi", "ico", "hdr", "ff"] }
resvg = "0.45"

[lib]
name = "unframed"
path = "src/lib.rs"

[[bin]]
name = "ufm"
path = "src/main.rs"

[[bin]]
name = "unframed"
path = "src/bin/unframed.rs"

[[bin]]
name = "ufm-msg"
path = "src/bin/ufm_msg.rs"

[[bin]]
name = "unframed-msg"
path = "src/bin/unframed_msg.rs"
